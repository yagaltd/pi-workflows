name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  drift:
    name: drift check (views vs sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Run CI gates
        run: just ci-lite
