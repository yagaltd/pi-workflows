# pi-workflows toolchain — pinned; `mise install` reproduces it
[tools]
bun = "1.3.11"
node = "25.8.0"
dprint = "0.65.0"
# Documentation gates for `scripts/docs-lint.sh` sections 1-3. Project-local
# on purpose: without the pins those sections skip and the summary still
# reads CLEAN.
markdownlint-cli2 = "0.24.1"
lychee = "0.24.2"
harper-cli = "3.2.0"
# @cc syntax gate + `cc-check list` for dispatch packs. The npm package is the
# @cc tool; crates.io `cc-check` 0.1.4 is an unrelated commit-message checker
# (probe 20261117: `cc-check format` → error: unexpected argument 'CONTRACTS').
"npm:@spolu/cc-check" = "0.2.0"
